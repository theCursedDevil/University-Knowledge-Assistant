# ==============================================================================
# Generative AI-Based University Knowledge Assistant — Unified Docker Compose
# Full stack with laptop-friendly defaults; optional replication/monitoring profiles
#
# Services:
#   1. postgres-primary   : PostgreSQL 16 Primary (Read-Write + WAL Sender)
#   2. postgres-replica-1 : PostgreSQL 16 Read Replica 1 (Hot Standby)
#   3. postgres-replica-2 : PostgreSQL 16 Read Replica 2 (Hot Standby)
#   4. redis              : Redis 7 In-Memory Cache & Distributed Locking
#   5. qdrant             : Qdrant Vector Database
#   6. minio              : MinIO Object Storage (S3-compatible)
#   7. keycloak           : Keycloak IAM (OAuth 2.0 / OIDC Identity Provider)
#   8. backend            : FastAPI Application (C-API)
#   9. frontend           : Next.js Application (C-FE)
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. PostgreSQL 16 Primary (Read-Write)
  # ----------------------------------------------------------------------------
  postgres-primary:
    image: postgres:16-alpine
    container_name: postgres-primary
    mem_limit: 384m
    cpus: "0.75"
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?Set POSTGRES_SUPERUSER_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-university_assistant}
      REPL_PASSWORD: ${REPL_PASSWORD:?Set REPL_PASSWORD}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD}
      READONLY_DB_PASSWORD: ${READONLY_DB_PASSWORD:?Set READONLY_DB_PASSWORD}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Set KEYCLOAK_DB_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    command: >
      postgres
      -c wal_level=replica
      -c max_wal_senders=10
      -c max_replication_slots=10
      -c hot_standby=on
      -c shared_buffers=64MB
      -c work_mem=4MB
      -c max_connections=30
    volumes:
      - postgres_primary_data:/var/lib/postgresql/data
      - ./database/init-replication.sql:/docker-entrypoint-initdb.d/01-init-replication.sql:ro
      - ./database/init-least-privilege.sql:/docker-entrypoint-initdb.d/02-init-least-privilege.sql:ro
      - ./docker/postgres/primary-init.sh:/docker-entrypoint-initdb.d/00-primary-init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_SUPERUSER:-postgres} -d ${POSTGRES_DB:-university_assistant}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - uka-network

  # ----------------------------------------------------------------------------
  # 2. PostgreSQL 16 Read Replica 1 (Hot Standby)
  # ----------------------------------------------------------------------------
  postgres-replica-1:
    profiles: ["replication"]
    image: postgres:16-alpine
    container_name: postgres-replica-1
    mem_limit: 256m
    cpus: "0.50"
    environment:
      PRIMARY_HOST: postgres-primary
      PRIMARY_PORT: 5432
      PRIMARY_USER: ${POSTGRES_SUPERUSER:-postgres}
      REPL_USER: uka_replicator
      REPL_PASSWORD: ${REPL_PASSWORD:?Set REPL_PASSWORD}
      REPL_SLOT: replica_1_slot
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_replica_1_data:/var/lib/postgresql/data
      - ./docker/postgres/replica-entrypoint.sh:/usr/local/bin/replica-entrypoint.sh:ro
    entrypoint: ["/usr/local/bin/replica-entrypoint.sh"]
    depends_on:
      postgres-primary:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_SUPERUSER:-postgres} -d ${POSTGRES_DB:-university_assistant}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - uka-network

  # ----------------------------------------------------------------------------
  # 3. PostgreSQL 16 Read Replica 2 (Hot Standby)
  # ----------------------------------------------------------------------------
  postgres-replica-2:
    profiles: ["replication"]
    image: postgres:16-alpine
    container_name: postgres-replica-2
    mem_limit: 256m
    cpus: "0.50"
    environment:
      PRIMARY_HOST: postgres-primary
      PRIMARY_PORT: 5432
      PRIMARY_USER: ${POSTGRES_SUPERUSER:-postgres}
      REPL_USER: uka_replicator
      REPL_PASSWORD: ${REPL_PASSWORD:?Set REPL_PASSWORD}
      REPL_SLOT: replica_2_slot
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - postgres_replica_2_data:/var/lib/postgresql/data
      - ./docker/postgres/replica-entrypoint.sh:/usr/local/bin/replica-entrypoint.sh:ro
    entrypoint: ["/usr/local/bin/replica-entrypoint.sh"]
    depends_on:
      postgres-primary:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_SUPERUSER:-postgres} -d ${POSTGRES_DB:-university_assistant}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - uka-network

  # ----------------------------------------------------------------------------
  # 4. Redis In-Memory Cache & Distributed Locking
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: redis
    mem_limit: 128m
    cpus: "0.25"
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD}", "--maxmemory", "64mb", "--maxmemory-policy", "noeviction"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - uka-network

  # ----------------------------------------------------------------------------
  # 5. Qdrant Vector Database
  # ----------------------------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:v1.20.1
    container_name: qdrant
    mem_limit: 384m
    cpus: "0.50"
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?Set QDRANT_API_KEY}
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - uka-network

  # ----------------------------------------------------------------------------
  # 6. MinIO Object Storage
  # ----------------------------------------------------------------------------
  minio:
    image: cgr.dev/chainguard/minio
    container_name: minio
    mem_limit: 256m
    cpus: "0.50"
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - uka-network

  # ----------------------------------------------------------------------------
  # 7. Keycloak Identity Provider (OAuth 2.0 / OIDC)
  # ----------------------------------------------------------------------------
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    container_name: keycloak
    mem_limit: 768m
    cpus: "1.00"
    command: ["start", "--import-realm", "--http-enabled=true"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:?Set KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD}
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8080}
      KC_HOSTNAME_STRICT: "true"
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      KC_DB: postgres
      KC_DB_URL_HOST: postgres-primary
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: uka_keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Set KEYCLOAK_DB_PASSWORD}
      JAVA_OPTS_APPEND: "-Xms128m -Xmx512m"
    volumes:
      - ./docker/keycloak/university-realm.json:/opt/keycloak/data/import/university-realm-realm.json:ro
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres-primary:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080'"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 25s
    networks:
      - uka-network

  # ----------------------------------------------------------------------------
  # 8. FastAPI Backend Application (C-API)
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: uka-backend
    mem_limit: 1200m
    cpus: "1.50"
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DEBUG: ${DEBUG:-false}
      ENABLE_DEV_AUTH: ${ENABLE_DEV_AUTH:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      TOKENIZERS_PARALLELISM: "false"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-8}
      EMBEDDING_NUM_THREADS: ${EMBEDDING_NUM_THREADS:-1}
      RAG_INGESTION_BATCH_SIZE: ${RAG_INGESTION_BATCH_SIZE:-8}
      RAG_MAX_CONCURRENT_INGESTIONS: ${RAG_MAX_CONCURRENT_INGESTIONS:-1}
      RAG_TOP_K: ${RAG_TOP_K:-4}
      MAX_UPLOAD_SIZE_BYTES: ${MAX_UPLOAD_SIZE_BYTES:-10485760}
      CORS_ORIGINS: '["http://localhost:3000","http://127.0.0.1:3000","http://frontend:3000"]'
      POSTGRES_HOST: postgres-primary
      POSTGRES_PORT: "5432"
      POSTGRES_USER: uka_app
      POSTGRES_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-university_assistant}
      DB_READ_REPLICAS_ENABLED: ${DB_READ_REPLICAS_ENABLED:-false}
      POSTGRES_REPLICA1_HOST: ${POSTGRES_REPLICA1_HOST:-postgres-primary}
      POSTGRES_REPLICA1_PORT: "5432"
      POSTGRES_REPLICA2_HOST: ${POSTGRES_REPLICA2_HOST:-postgres-primary}
      POSTGRES_REPLICA2_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6333"
      QDRANT_API_KEY: ${QDRANT_API_KEY:?Set QDRANT_API_KEY}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
      MINIO_SECURE: "false"
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-university-documents}
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_PUBLIC_URL: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8080}
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER:-http://localhost:8080/realms/university-realm}
      KEYCLOAK_AUDIENCE: ${KEYCLOAK_AUDIENCE:-university-assistant-client}
      KEYCLOAK_REDIRECT_URI: ${KEYCLOAK_REDIRECT_URI:-http://localhost:3000/auth/callback}
      KEYCLOAK_REALM: university-realm
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-university-assistant-client}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-qwen/qwen3.8-27b}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend/app:/app/backend/app:ro
    depends_on:
      postgres-primary:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      minio:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - uka-network

  # ----------------------------------------------------------------------------
  # 9. Next.js 14 Frontend Application (C-FE)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
        NEXT_PUBLIC_KEYCLOAK_URL: ${NEXT_PUBLIC_KEYCLOAK_URL:-http://localhost:8080}
        NEXT_PUBLIC_KEYCLOAK_REALM: ${NEXT_PUBLIC_KEYCLOAK_REALM:-university-realm}
        NEXT_PUBLIC_KEYCLOAK_CLIENT_ID: ${NEXT_PUBLIC_KEYCLOAK_CLIENT_ID:-university-assistant-client}
        NEXT_PUBLIC_DEV_LOGIN: ${NEXT_PUBLIC_DEV_LOGIN:-false}
    container_name: uka-frontend
    mem_limit: 512m
    cpus: "0.75"
    environment:
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
      NEXT_PUBLIC_KEYCLOAK_URL: ${NEXT_PUBLIC_KEYCLOAK_URL:-http://localhost:8080}
      NEXT_PUBLIC_KEYCLOAK_REALM: ${NEXT_PUBLIC_KEYCLOAK_REALM:-university-realm}
      NEXT_PUBLIC_KEYCLOAK_CLIENT_ID: ${NEXT_PUBLIC_KEYCLOAK_CLIENT_ID:-university-assistant-client}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/login"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - uka-network

  # ----------------------------------------------------------------------------
  # 10. Prometheus Time-Series Monitoring (C-MON, FR-MON, Prompt 27)
  # ----------------------------------------------------------------------------
  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:v2.51.0
    container_name: uka-prometheus
    mem_limit: 128m
    cpus: "0.25"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=2h"
      - "--storage.tsdb.retention.size=100MB"
      - "--web.enable-lifecycle"
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9091}:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - uka-network

  # ----------------------------------------------------------------------------
  # 11. Grafana Operational Dashboards (C-MON, FR-MON, Prompt 27)
  # ----------------------------------------------------------------------------
  grafana:
    profiles: ["monitoring"]
    image: grafana/grafana:10.4.0
    container_name: uka-grafana
    mem_limit: 192m
    cpus: "0.25"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:?Set GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - uka-network

# ------------------------------------------------------------------------------
# Named Persistent Storage Volumes
# ------------------------------------------------------------------------------
volumes:
  postgres_primary_data:
  postgres_replica_1_data:
  postgres_replica_2_data:
  redis_data:
  qdrant_data:
  minio_data:
  prometheus_data:
  grafana_data:

# ------------------------------------------------------------------------------
# Dedicated Internal Bridge Network
# ------------------------------------------------------------------------------
networks:
  uka-network:
    name: uka-network
    driver: bridge
