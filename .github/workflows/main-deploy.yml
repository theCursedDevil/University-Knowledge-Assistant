name: Main Branch CI/CD & Image Publish

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  quality-gate:
    name: Verify Quality Gates
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: university_assistant
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install ruff

      - name: Run Backend Linting
        run: ./scripts/ci/lint-backend.sh

      - name: Start MinIO & Qdrant Test Services
        run: |
          docker run -d --name minio -p 9000:9000 -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin cgr.dev/chainguard/minio:latest server /data
          docker run -d --name qdrant -p 6333:6333 qdrant/qdrant:latest
          for i in {1..30}; do
            if curl -s http://localhost:9000/minio/health/live > /dev/null && curl -s http://localhost:6333/healthz > /dev/null; then
              echo "MinIO and Qdrant are ready!"
              break
            fi
            echo "Waiting for MinIO and Qdrant..."
            sleep 1
          done

      - name: Run Backend Tests
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: university_assistant
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          MINIO_ENDPOINT: localhost:9000
          MINIO_ACCESS_KEY: minioadmin
          MINIO_SECRET_KEY: minioadmin
          MINIO_SECURE: "false"
          QDRANT_HOST: localhost
          QDRANT_PORT: 6333
          CACHE_ENABLED: "true"
          RATE_LIMIT_ENABLED: "false"
          SECRET_KEY: "ci-testing-secret-key-at-least-32-bytes"
        run: ./scripts/ci/test-backend.sh

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Frontend Linting
        run: ./scripts/ci/lint-frontend.sh

      - name: Run Frontend Production Build Check
        run: ./scripts/ci/build-frontend.sh

  build-and-publish:
    name: Build & Publish Docker Images (GHCR)
    needs: quality-gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Convert Repository Name to Lowercase
        id: repo_name
        run: echo "REGISTRY_PREFIX=ghcr.io/${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Build Backend Docker Image
        run: ./scripts/ci/build-docker.sh backend ${{ github.sha }} ${{ env.REGISTRY_PREFIX }}

      - name: Build Frontend Docker Image
        run: ./scripts/ci/build-docker.sh frontend ${{ github.sha }} ${{ env.REGISTRY_PREFIX }}

      - name: Push Backend Docker Image
        run: ./scripts/ci/push-docker.sh backend ${{ github.sha }} ${{ env.REGISTRY_PREFIX }}

      - name: Push Frontend Docker Image
        run: ./scripts/ci/push-docker.sh frontend ${{ github.sha }} ${{ env.REGISTRY_PREFIX }}

  deploy:
    name: Kubernetes Deployment & Verification
    needs: build-and-publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: "latest"

      - name: Convert Repository Name to Lowercase
        run: echo "REGISTRY_PREFIX=ghcr.io/${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Configure Kubeconfig (if remote secret provided)
        if: "${{ secrets.KUBECONFIG_DATA != '' }}"
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_DATA }}" | base64 --decode > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Run Kubernetes Deployment Verification
        run: ./scripts/deploy/deploy-k8s.sh ${{ github.sha }} ${{ env.REGISTRY_PREFIX }}
