name: Pull Request Quality Gate

on:
  pull_request:
    branches:
      - main
    paths:
      - "backend/**"
      - "frontend/**"
      - "docker/**"
      - "kubernetes/**"
      - "scripts/**"
      - "pyproject.toml"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  backend-quality:
    name: Backend Lint & Automated Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: university_assistant
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install ruff

      - name: Run Backend Linting (Ruff)
        run: ./scripts/ci/lint-backend.sh

      - name: Start MinIO & Qdrant Test Services
        run: |
          docker run -d --name minio -p 9000:9000 -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin cgr.dev/chainguard/minio:latest server /data
          docker run -d --name qdrant -p 6333:6333 qdrant/qdrant:latest
          for i in {1..30}; do
            if curl -s http://localhost:9000/minio/health/live > /dev/null && curl -s http://localhost:6333/healthz > /dev/null; then
              echo "MinIO and Qdrant are ready!"
              break
            fi
            echo "Waiting for MinIO and Qdrant..."
            sleep 1
          done

      - name: Run Backend Automated Tests (pytest)
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: university_assistant
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          MINIO_ENDPOINT: localhost:9000
          MINIO_ACCESS_KEY: minioadmin
          MINIO_SECRET_KEY: minioadmin
          MINIO_SECURE: "false"
          QDRANT_HOST: localhost
          QDRANT_PORT: 6333
          CACHE_ENABLED: "true"
          RATE_LIMIT_ENABLED: "false"
          SECRET_KEY: "ci-testing-secret-key-at-least-32-bytes"
        run: ./scripts/ci/test-backend.sh

  frontend-quality:
    name: Frontend Lint & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install Dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Frontend Linting (next lint)
        run: ./scripts/ci/lint-frontend.sh

      - name: Run Frontend Production Build Check
        run: ./scripts/ci/build-frontend.sh
