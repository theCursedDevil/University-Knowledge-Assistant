apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  template:
    spec:
      containers:
        - name: frontend
          env:
            - name: NEXT_PUBLIC_API_URL
              value: http://localhost:8000/api/v1
            - name: NEXT_PUBLIC_KEYCLOAK_URL
              value: http://localhost:8080
          resources:
            requests:
              cpu: 75m
              memory: 96Mi
            limits:
              cpu: 350m
              memory: 384Mi
