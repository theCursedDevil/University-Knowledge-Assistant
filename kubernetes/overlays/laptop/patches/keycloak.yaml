apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
spec:
  template:
    spec:
      containers:
        - name: keycloak
          args:
            - start
            - --import-realm
            - --http-enabled=true
            - --hostname=http://localhost:8080
            - --hostname-strict=false
          env:
            - name: JAVA_OPTS_APPEND
              value: '-Xms128m -Xmx512m'
          resources:
            requests:
              cpu: 150m
              memory: 256Mi
            limits:
              cpu: 750m
              memory: 768Mi
