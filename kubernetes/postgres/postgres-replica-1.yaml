apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-replica-1
  namespace: default
  labels:
    app.kubernetes.io/name: university-knowledge-assistant
    app.kubernetes.io/component: postgres-replica-1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-replica-1
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: postgres-replica-1
        app.kubernetes.io/component: postgres-replica-1
    spec:
      securityContext:
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
      containers:
      - name: postgres-replica-1
        image: postgres:16-alpine
        imagePullPolicy: IfNotPresent
        command:
        - /opt/replica-scripts/replica-entrypoint.sh
        env:
        - name: PRIMARY_HOST
          value: postgres-primary
        - name: PRIMARY_PORT
          value: '5432'
        - name: PRIMARY_USER
          valueFrom:
            secretKeyRef:
              name: uka-secrets
              key: POSTGRES_SUPERUSER
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: uka-secrets
              key: POSTGRES_SUPERUSER
        - name: POSTGRES_DB
          value: university_assistant
        - name: REPL_USER
          value: uka_replicator
        - name: REPL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: uka-secrets
              key: REPL_PASSWORD
        - name: REPL_SLOT
          value: replica_1_slot
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        ports:
        - containerPort: 5432
          name: postgres
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
        - name: replica-scripts
          mountPath: /opt/replica-scripts
        livenessProbe:
          exec:
            command:
            - sh
            - -c
            - pg_isready -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"
          initialDelaySeconds: 20
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 5
        readinessProbe:
          exec:
            command:
            - sh
            - -c
            - pg_isready -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"
          initialDelaySeconds: 15
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 5
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 999
          runAsGroup: 999
          seccompProfile:
            type: RuntimeDefault
          capabilities:
            drop:
            - ALL
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: postgres-replica-1-pvc
      - name: replica-scripts
        configMap:
          name: postgres-replica-scripts
          defaultMode: 493
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-replica-1
  namespace: default
  labels:
    app.kubernetes.io/name: university-knowledge-assistant
    app.kubernetes.io/component: postgres-replica-1
spec:
  type: ClusterIP
  ports:
  - port: 5432
    targetPort: 5432
    name: postgres
  selector:
    app: postgres-replica-1
