apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-primary
  namespace: default
  labels:
    app.kubernetes.io/name: university-knowledge-assistant
    app.kubernetes.io/component: postgres-primary
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-primary
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: postgres-primary
        app.kubernetes.io/component: postgres-primary
    spec:
      securityContext:
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
      containers:
      - name: postgres-primary
        image: postgres:16-alpine
        imagePullPolicy: IfNotPresent
        args:
        - -c
        - wal_level=replica
        - -c
        - max_wal_senders=10
        - -c
        - max_replication_slots=10
        - -c
        - hot_standby=on
        env:
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: uka-secrets
              key: POSTGRES_SUPERUSER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: uka-secrets
              key: POSTGRES_SUPERUSER_PASSWORD
        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef:
              name: uka-secrets
              key: POSTGRES_DB
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        ports:
        - containerPort: 5432
          name: postgres
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
        - name: init-scripts
          mountPath: /docker-entrypoint-initdb.d
        livenessProbe:
          exec:
            command:
            - sh
            - -c
            - pg_isready -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"
          initialDelaySeconds: 20
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 5
        readinessProbe:
          exec:
            command:
            - sh
            - -c
            - pg_isready -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"
          initialDelaySeconds: 15
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 5
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        envFrom:
        - secretRef:
            name: uka-secrets
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 999
          runAsGroup: 999
          seccompProfile:
            type: RuntimeDefault
          capabilities:
            drop:
            - ALL
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: postgres-primary-pvc
      - name: init-scripts
        configMap:
          name: postgres-init-scripts
          defaultMode: 493
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-primary
  namespace: default
  labels:
    app.kubernetes.io/name: university-knowledge-assistant
    app.kubernetes.io/component: postgres-primary
spec:
  type: ClusterIP
  ports:
  - port: 5432
    targetPort: 5432
    name: postgres
  selector:
    app: postgres-primary
