# ==============================================================================
# Kubernetes Secret Management Template for University Knowledge Assistant
# Implements Requirement 12 & 13: Secure environment variable handling & no plain secrets
#
# In production, manage via SealedSecrets, External Secrets Operator (AWS/Vault/GCP),
# or inject via CI/CD pipeline using GitHub Actions Secrets.
# ==============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: uka-backend-secrets
  namespace: default
  labels:
    app.kubernetes.io/name: university-knowledge-assistant
    app.kubernetes.io/component: backend
type: Opaque
stringData:
  # Database Credentials (least-privilege application account)
  POSTGRES_USER: "uka_app"
  POSTGRES_PASSWORD: "CHANGE_ME_PRODUCTION_DB_PASSWORD"
  POSTGRES_DB: "university_assistant"
  
  # MinIO S3 Object Storage Credentials
  MINIO_ACCESS_KEY: "CHANGE_ME_MINIO_ACCESS_KEY"
  MINIO_SECRET_KEY: "CHANGE_ME_MINIO_SECRET_KEY"
  
  # LLM & Vector DB Secrets
  GROQ_API_KEY: "CHANGE_ME_GROQ_API_KEY"
  QDRANT_API_KEY: "CHANGE_ME_OPTIONAL_QDRANT_KEY"
  
  # Keycloak OIDC Client Secret
  KEYCLOAK_CLIENT_SECRET: "CHANGE_ME_KEYCLOAK_CLIENT_SECRET"
  
  # Application Session Encryption Secret
  SECRET_KEY: "CHANGE_ME_RANDOM_32_BYTE_HEX_KEY"
