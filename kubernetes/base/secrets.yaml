apiVersion: v1
kind: Secret
metadata:
  name: uka-secrets
  namespace: default
  labels:
    app.kubernetes.io/name: university-knowledge-assistant
    app.kubernetes.io/part-of: uka
type: Opaque
stringData:
  # Database Credentials (least-privilege application account)
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "postgres"
  POSTGRES_DB: "university_assistant"
  REPL_PASSWORD: "uka_replica_stream_password"
  
  # Redis credentials
  REDIS_PASSWORD: ""
  
  # MinIO Object Storage Credentials
  MINIO_ROOT_USER: "minioadmin"
  MINIO_ROOT_PASSWORD: "minioadmin"
  MINIO_ACCESS_KEY: "minioadmin"
  MINIO_SECRET_KEY: "minioadmin"
  
  # Keycloak IAM Credentials
  KEYCLOAK_ADMIN: "admin"
  KEYCLOAK_ADMIN_PASSWORD: "admin"
  KEYCLOAK_CLIENT_SECRET: ""
  
  # LLM API & Vector DB
  GROQ_API_KEY: "mock-groq-key"
  GEMINI_API_KEY: ""
  QDRANT_API_KEY: ""
  
  # Application Session Encryption Secret
  SECRET_KEY: "uka-dev-secret-key-32-bytes-long"
