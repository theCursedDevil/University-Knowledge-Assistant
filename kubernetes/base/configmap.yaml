apiVersion: v1
kind: ConfigMap
metadata:
  name: uka-config
  namespace: default
  labels:
    app.kubernetes.io/name: university-knowledge-assistant
    app.kubernetes.io/part-of: uka
data:
  ENVIRONMENT: production
  DEBUG: 'false'
  LOG_LEVEL: INFO
  HOST: 0.0.0.0
  PORT: '8000'
  CORS_ORIGINS: '["https://uka.university.edu"]'
  POSTGRES_HOST: postgres-primary
  POSTGRES_PORT: '5432'
  POSTGRES_REPLICA1_HOST: postgres-replica-1
  POSTGRES_REPLICA1_PORT: '5432'
  POSTGRES_REPLICA2_HOST: postgres-replica-2
  POSTGRES_REPLICA2_PORT: '5432'
  DB_READ_REPLICAS_ENABLED: 'true'
  READ_YOUR_WRITES_WINDOW_SECONDS: '5.0'
  REDIS_HOST: redis
  REDIS_PORT: '6379'
  CACHE_ENABLED: 'true'
  CACHE_DEFAULT_TTL_SECONDS: '60'
  CACHE_DOCUMENTS_LIST_TTL: '60'
  CACHE_ADMIN_STATS_TTL: '60'
  LOCK_DEFAULT_TIMEOUT_SECONDS: '5.0'
  LOCK_DEFAULT_EXPIRE_SECONDS: '30.0'
  QDRANT_HOST: qdrant
  QDRANT_PORT: '6333'
  QDRANT_COLLECTION: university_documents
  MINIO_ENDPOINT: minio:9000
  MINIO_BUCKET_NAME: university-documents
  MINIO_SECURE: 'false'
  KEYCLOAK_URL: http://keycloak:8080
  KEYCLOAK_PUBLIC_URL: https://uka.university.edu
  KEYCLOAK_REALM: university-realm
  KEYCLOAK_CLIENT_ID: university-assistant-client
  HF_HUB_OFFLINE: '1'
  TRANSFORMERS_OFFLINE: '1'
  EMBEDDING_MODEL_NAME: sentence-transformers/all-MiniLM-L6-v2
  GROQ_MODEL: llama-3.1-8b-instant
  RAG_TOP_K: '5'
  RAG_CONFIDENCE_THRESHOLD: '0.30'
  RAG_LLM_TEMPERATURE: '0.1'
  RATE_LIMIT_ENABLED: 'true'
  RATE_LIMIT_LLM_RPM: '20'
  ENABLE_DEV_AUTH: 'false'
  POSTGRES_DB: university_assistant
  POSTGRES_USER: uka_app
  KEYCLOAK_ISSUER: https://uka.university.edu/realms/university-realm
  KEYCLOAK_AUDIENCE: university-assistant-client
  KEYCLOAK_REDIRECT_URI: https://uka.university.edu/auth/callback
  NEXT_PUBLIC_API_URL: https://uka.university.edu/api/v1
  NEXT_PUBLIC_KEYCLOAK_URL: https://uka.university.edu
  NEXT_PUBLIC_KEYCLOAK_REALM: university-realm
  NEXT_PUBLIC_KEYCLOAK_CLIENT_ID: university-assistant-client
  NEXT_PUBLIC_DEV_LOGIN: "false"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-scripts
  namespace: default
  labels:
    app.kubernetes.io/name: university-knowledge-assistant
    app.kubernetes.io/component: database
data:
  00-primary-init.sh: "#!/bin/bash\nset -e\n\necho \"Configuring PostgreSQL Primary\
    \ for physical streaming replication...\"\n\n# Append host replication entry to\
    \ pg_hba.conf if not already present\nif ! grep -q \"host replication all 0.0.0.0/0\
    \ scram-sha-256\" \"$PGDATA/pg_hba.conf\"; then\n    echo \"host replication all\
    \ 0.0.0.0/0 scram-sha-256\" >> \"$PGDATA/pg_hba.conf\"\n    echo \"Replication\
    \ pg_hba entry added.\"\nfi\n"
  01-init-replication.sql: '-- Create the streaming-replication account and slots
    using container secrets.

    \set ON_ERROR_STOP on

    \getenv repl_password REPL_PASSWORD


    SELECT format(''CREATE ROLE uka_replicator WITH REPLICATION LOGIN PASSWORD %L'',
    :''repl_password'')

    WHERE NOT EXISTS (SELECT 1 FROM pg_catalog.pg_roles WHERE rolname = ''uka_replicator'')

    \gexec

    ALTER ROLE uka_replicator WITH REPLICATION LOGIN PASSWORD :''repl_password'';


    SELECT pg_create_physical_replication_slot(''replica_1_slot'')

    WHERE NOT EXISTS (SELECT 1 FROM pg_replication_slots WHERE slot_name = ''replica_1_slot'');


    SELECT pg_create_physical_replication_slot(''replica_2_slot'')

    WHERE NOT EXISTS (SELECT 1 FROM pg_replication_slots WHERE slot_name = ''replica_2_slot'');

    '
  02-init-least-privilege.sql: '-- Create least-privilege application accounts using
    container-provided secrets.

    \set ON_ERROR_STOP on

    \getenv app_password APP_DB_PASSWORD

    \getenv readonly_password READONLY_DB_PASSWORD

    \getenv repl_password REPL_PASSWORD

    \getenv keycloak_password KEYCLOAK_DB_PASSWORD


    SELECT format(''CREATE ROLE uka_keycloak WITH LOGIN PASSWORD %L'', :''keycloak_password'')

    WHERE NOT EXISTS (SELECT 1 FROM pg_catalog.pg_roles WHERE rolname = ''uka_keycloak'')

    \gexec

    ALTER ROLE uka_keycloak WITH LOGIN PASSWORD :''keycloak_password'';


    SELECT format(''CREATE DATABASE keycloak OWNER uka_keycloak'')

    WHERE NOT EXISTS (SELECT 1 FROM pg_database WHERE datname = ''keycloak'')

    \gexec


    SELECT format(''CREATE ROLE uka_app WITH LOGIN PASSWORD %L'', :''app_password'')

    WHERE NOT EXISTS (SELECT 1 FROM pg_catalog.pg_roles WHERE rolname = ''uka_app'')

    \gexec

    ALTER ROLE uka_app WITH LOGIN PASSWORD :''app_password'';


    SELECT format(''GRANT CONNECT ON DATABASE %I TO uka_app'', current_database())
    \gexec

    GRANT USAGE, CREATE ON SCHEMA public TO uka_app;

    GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO uka_app;

    GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO uka_app;

    ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT SELECT, INSERT, UPDATE, DELETE
    ON TABLES TO uka_app;

    ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT USAGE, SELECT ON SEQUENCES TO
    uka_app;

    -- uka_app runs Alembic upgrades at backend startup, so it needs CREATE on public.


    SELECT format(''CREATE ROLE uka_readonly WITH LOGIN PASSWORD %L'', :''readonly_password'')

    WHERE NOT EXISTS (SELECT 1 FROM pg_catalog.pg_roles WHERE rolname = ''uka_readonly'')

    \gexec

    ALTER ROLE uka_readonly WITH LOGIN PASSWORD :''readonly_password'';

    SELECT format(''GRANT CONNECT ON DATABASE %I TO uka_readonly'', current_database())
    \gexec

    GRANT USAGE ON SCHEMA public TO uka_readonly;

    GRANT SELECT ON ALL TABLES IN SCHEMA public TO uka_readonly;

    ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT SELECT ON TABLES TO uka_readonly;

    REVOKE INSERT, UPDATE, DELETE, TRUNCATE, REFERENCES, TRIGGER ON ALL TABLES IN
    SCHEMA public FROM uka_readonly;

    REVOKE CREATE ON SCHEMA public FROM uka_readonly;


    SELECT format(''CREATE ROLE uka_replicator WITH REPLICATION LOGIN PASSWORD %L'',
    :''repl_password'')

    WHERE NOT EXISTS (SELECT 1 FROM pg_catalog.pg_roles WHERE rolname = ''uka_replicator'')

    \gexec

    ALTER ROLE uka_replicator WITH REPLICATION LOGIN PASSWORD :''repl_password'';

    '
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-replica-scripts
  namespace: default
  labels:
    app.kubernetes.io/name: university-knowledge-assistant
    app.kubernetes.io/component: database
data:
  replica-entrypoint.sh: "#!/bin/sh\nset -e\n\nPRIMARY_HOST=\"${PRIMARY_HOST:-postgres-primary}\"\
    \nPRIMARY_PORT=\"${PRIMARY_PORT:-5432}\"\nPRIMARY_USER=\"${PRIMARY_USER:-postgres}\"\
    \nREPL_USER=\"${REPL_USER:-uka_replicator}\"\nREPL_PASSWORD=\"${REPL_PASSWORD:?REPL_PASSWORD\
    \ must be set in uka-secrets}\"\nREPL_SLOT=\"${REPL_SLOT:-replica_1_slot}\"\n\
    PGDATA=\"${PGDATA:-/var/lib/postgresql/data/pgdata}\"\n\necho \"Starting standby\
    \ replica configuration for slot: $REPL_SLOT...\"\n\nmkdir -p \"$PGDATA\"\n\n\
    if [ ! -s \"$PGDATA/PG_VERSION\" ]; then\n    echo \"Standby database directory\
    \ is empty. Waiting for primary $PRIMARY_HOST:$PRIMARY_PORT...\"\n    until pg_isready\
    \ -h \"$PRIMARY_HOST\" -p \"$PRIMARY_PORT\" -U \"$PRIMARY_USER\"; do\n       \
    \ echo \"Primary not ready yet, sleeping 1s...\"\n        sleep 1\n    done\n\n\
    \    echo \"Primary is ready. Taking pg_basebackup from $PRIMARY_HOST using replication\
    \ slot $REPL_SLOT...\"\n    rm -rf \"${PGDATA:?}\"/*\n    PGPASSWORD=\"$REPL_PASSWORD\"\
    \ pg_basebackup \\\n        -h \"$PRIMARY_HOST\" \\\n        -p \"$PRIMARY_PORT\"\
    \ \\\n        -U \"$REPL_USER\" \\\n        -D \"$PGDATA\" \\\n        -Fp \\\n\
    \        -Xs \\\n        -P \\\n        -R \\\n        -S \"$REPL_SLOT\"\n\n \
    \   echo \"Base backup completed successfully.\"\nfi\n\ntouch \"$PGDATA/standby.signal\"\
    \nchown -R postgres:postgres \"$PGDATA\"\nchmod 700 \"$PGDATA\"\n\necho \"Starting\
    \ PostgreSQL 16 as user 'postgres' in read-only standby mode...\"\nif command\
    \ -v su-exec >/dev/null 2>&1; then\n    exec su-exec postgres postgres -D \"$PGDATA\"\
    \ -c hot_standby=on -c default_transaction_read_only=on\nelif command -v gosu\
    \ >/dev/null 2>&1; then\n    exec gosu postgres postgres -D \"$PGDATA\" -c hot_standby=on\
    \ -c default_transaction_read_only=on\nelse\n    exec su -s /bin/sh postgres -c\
    \ \"postgres -D $PGDATA -c hot_standby=on -c default_transaction_read_only=on\"\
    \nfi\n"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-realm-config
  namespace: default
  labels:
    app.kubernetes.io/name: university-knowledge-assistant
    app.kubernetes.io/component: auth
data:
  university-realm.json: "{\n  \"realm\": \"university-realm\",\n  \"displayName\"\
    : \"University Knowledge Assistant\",\n  \"enabled\": true,\n  \"sslRequired\"\
    : \"external\",\n  \"registrationAllowed\": true,\n  \"loginWithEmailAllowed\"\
    : true,\n  \"duplicateEmailsAllowed\": false,\n  \"resetPasswordAllowed\": true,\n\
    \  \"editUsernameAllowed\": false,\n  \"accessTokenLifespan\": 1800,\n  \"ssoSessionIdleTimeout\"\
    : 3600,\n  \"ssoSessionMaxLifespan\": 7200,\n  \"roles\": {\n    \"realm\": [\n\
    \      {\n        \"id\": \"role-admin-id\",\n        \"name\": \"admin\",\n \
    \       \"description\": \"University System Administrator with full catalog and\
    \ system management rights\",\n        \"composite\": false,\n        \"clientRole\"\
    : false\n      },\n      {\n        \"id\": \"role-faculty-id\",\n        \"name\"\
    : \"faculty\",\n        \"description\": \"University Faculty Member with research\
    \ and curriculum document access\",\n        \"composite\": false,\n        \"\
    clientRole\": false\n      },\n      {\n        \"id\": \"role-student-id\",\n\
    \        \"name\": \"student\",\n        \"description\": \"Enrolled University\
    \ Student with general inquiry and catalog access\",\n        \"composite\": false,\n\
    \        \"clientRole\": false\n      }\n    ]\n  },\n  \"defaultRoles\": [\n\
    \    \"student\"\n  ],\n  \"identityProviders\": [\n    {\n      \"alias\": \"\
    google\",\n      \"displayName\": \"Google\",\n      \"providerId\": \"google\"\
    ,\n      \"enabled\": true,\n      \"trustEmail\": true,\n      \"storeToken\"\
    : false,\n      \"addReadTokenRoleOnCreate\": false,\n      \"authenticateByDefault\"\
    : false,\n      \"linkOnly\": false,\n      \"firstBrokerLoginFlowAlias\": \"\
    first broker login\",\n      \"config\": {\n        \"clientId\": \"${env.GOOGLE_CLIENT_ID:placeholder-google-client-id}\"\
    ,\n        \"clientSecret\": \"${env.GOOGLE_CLIENT_SECRET:placeholder-google-client-secret}\"\
    ,\n        \"defaultScope\": \"openid profile email\",\n        \"prompt\": \"select_account\",\n        \"syncMode\":\
    \ \"IMPORT\",\n        \"useUserinfoEndpoint\": \"true\"\n      }\n    }\n  ],\n\
    \  \"clients\": [\n    {\n      \"clientId\": \"university-assistant-client\"\
    ,\n      \"name\": \"University Knowledge Assistant Web Application\",\n     \
    \ \"description\": \"Next.js Frontend & FastAPI Backend Client with PKCE enabled\"\
    ,\n      \"enabled\": true,\n      \"clientAuthenticatorType\": \"client-secret\"\
    ,\n      \"redirectUris\": [\n        \"http://localhost:3000/auth/callback\"\
    ,\n        \"http://127.0.0.1:3000/auth/callback\"\
    ,\n        \"https://uka.university.edu/auth/callback\"\n      ],\n      \"webOrigins\"\
    : [\n        \"http://localhost:3000\",\n        \"http://127.0.0.1:3000\",\n        \"https://uka.university.edu\"\
    \n      ],\n      \"publicClient\": true,\n      \"protocol\": \"openid-connect\"\
    ,\n      \"standardFlowEnabled\": true,\n      \"implicitFlowEnabled\": false,\n\
    \      \"directAccessGrantsEnabled\": false,\n      \"serviceAccountsEnabled\"\
    : false,\n      \"fullScopeAllowed\": false,\n      \"attributes\": {\n      \
    \  \"pkce.code.challenge.method\": \"S256\",\n        \"post.logout.redirect.uris\"\
    : \"http://localhost:3000/*##https://uka.university.edu/*\"\n      },\n      \"\
    defaultClientScopes\": [\n        \"basic\",\n        \"web-origins\",\n        \"acr\",\n       \
    \ \"roles\",\n        \"profile\",\n        \"email\"\n      ],\n      \"protocolMappers\"\
    : [\n        {\n          \"name\": \"university-assistant-client-audience\",\n\
    \          \"protocol\": \"openid-connect\",\n          \"protocolMapper\": \"\
    oidc-audience-mapper\",\n          \"consentRequired\": false,\n          \"config\"\
    : {\n            \"included.client.audience\": \"university-assistant-client\"\
    ,\n            \"id.token.claim\": \"false\",\n            \"access.token.claim\"\
    : \"true\",\n            \"userinfo.token.claim\": \"false\"\n          }\n  \
    \      },\n        {\n          \"name\": \"email-verified\",\n\
    \          \"protocol\": \"openid-connect\",\n          \"protocolMapper\": \"\
    oidc-usermodel-property-mapper\",\n          \"consentRequired\": false,\n\
    \          \"config\": {\n            \"user.attribute\": \"emailVerified\",\n\
    \            \"claim.name\": \"email_verified\",\n            \"jsonType.label\": \"boolean\",\n\
    \            \"id.token.claim\": \"true\",\n            \"access.token.claim\": \"true\",\n\
    \            \"userinfo.token.claim\": \"true\"\n          }\n        }\n      ]\n    }\n  ],\n  \"verifyEmail\": false\n}\n"
